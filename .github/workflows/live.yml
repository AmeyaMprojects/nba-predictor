name: live

on:
  schedule:
    # GitHub fires this cron only every few hours in practice, so one job
    # loops for ~5.5 h (cloud-loop, every 15 min on :07/:22/:37/:52). The cron
    # only restarts it: a start while a job runs queues behind it (the
    # concurrency group below never cancels), off the top of the hour.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch site.yml (GITHUB_TOKEN pushes do not trigger it)

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # cloud-loop kills each iteration at 15 min and starts none that could run past 330
    env:
      # Shadow by default: set the repository variable to `main` at cut-over.
      PREDICTOR_PUBLISH_BRANCH: ${{ vars.PREDICTOR_PUBLISH_BRANCH || 'cloud-shadow' }}
      # GH_TOKEN is set only on the step that calls gh (Cloud run).
      GH_REPO: ${{ github.repository }}
      GH_PROMPT_DISABLED: '1'
    steps:
      # Shallow is enough: cloud-run's start-of-run `git fetch` + `merge --ff-only`
      # and its pushes work on a shallow clone. site.yml keeps full history.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - name: Git identity
        run: |
          # runner.temp is not available in job-level env, so the data dir is set here.
          echo "PREDICTOR_DATA_DIR=$RUNNER_TEMP/predictor-data" >> "$GITHUB_ENV"
          git config --global user.name "nba-predictor-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The state worktree lives in $RUNNER_TEMP so it never makes the code
      # checkout look dirty to code_version.
      - name: State checkout
        run: |
          case "$PREDICTOR_PUBLISH_BRANCH" in
            main|cloud-shadow) ;;
            *) echo "::error::PREDICTOR_PUBLISH_BRANCH must be main or cloud-shadow"; exit 1 ;;
          esac
          if [ "$PREDICTOR_PUBLISH_BRANCH" = main ]; then
            echo "STATE_REPO=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            git fetch --depth=1 origin "+refs/heads/$PREDICTOR_PUBLISH_BRANCH:refs/remotes/origin/$PREDICTOR_PUBLISH_BRANCH" \
              || { echo "::error::branch $PREDICTOR_PUBLISH_BRANCH missing - create it by hand"; exit 1; }
            git worktree add -B "$PREDICTOR_PUBLISH_BRANCH" "$RUNNER_TEMP/state-repo" "origin/$PREDICTOR_PUBLISH_BRANCH"
            echo "STATE_REPO=$RUNNER_TEMP/state-repo" >> "$GITHUB_ENV"
          fi

      # Each iteration is a cloud-run child process (killed at 15 min) with its
      # own data dir under $PREDICTOR_DATA_DIR, removed afterwards. cloud-loop
      # also dispatches site.yml after an iteration that pushed predictions to
      # main (never in shadow mode).
      - id: cloud
        name: Cloud run
        run: uv run --frozen predictor cloud-loop --state-repo "$STATE_REPO" --max-minutes 330
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh release upload of raw archives; gh workflow run site.yml

      # cloud-loop moves an iteration's raw dir to kept/ only when its release
      # upload failed and no secret was found in it; a secret found in any
      # iteration stops the loop and sets secret_leak, and then nothing is
      # uploaded. Odds responses may not be republished: they stay in the temp dir.
      - name: Keep raw responses if a release upload failed
        if: always() && steps.cloud.outputs.raw_kept == 'true' && steps.cloud.outputs.secret_leak != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 'raw-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            ${{ runner.temp }}/predictor-data/kept/*/raw
            !${{ runner.temp }}/predictor-data/kept/*/raw/odds
            !${{ runner.temp }}/predictor-data/kept/*/raw/odds_history
          retention-days: 7
